# Carolina Code Conference Fly org: carolina-code-conference
# Public hostname: carolina-codes-kotlin.fly.dev

app = "carolina-codes-kotlin"
primary_region = "iad"

[build]

[env]
  PORT = "8080"
  CAROLINA_URL = "http://carolina-codes.internal:8080"
  PUBLIC_BASE_URL = "https://carolina-codes-kotlin.fly.dev"
  JAVA_OPTS = "-XX:MaxRAMPercentage=55.0 -XX:+UseG1GC -XX:ActiveProcessorCount=1 -XX:+ExitOnOutOfMemoryError -XX:TieredStopAtLevel=1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
