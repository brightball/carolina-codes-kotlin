# One Gitea Actions job per local precommit check.
# Not a single combined job. Tests, SAST, deps, gitleaks, and style run
# in parallel after one environment-prep job.
#
# act_runner starts a new container per job and blocks host bind-mounts.
# Run steps are executed with dash, so scripts stay POSIX (`set -eu`, no pipes).
# Prep token-clones GITHUB_SHA, installs packages/tools once, scrubs the
# clone token from remote.origin.url, and uploads a workspace tarball
# (source, .git, JDK, gitleaks, osv-scanner, Gradle home). Keep .git so
# `gitleaks detect --source . --verbose` can scan; do not --exclude it.
# Check jobs restore that artifact and only run their named command.
# They do not apt-get, curl tools, or clone.
#
# The Node image is required so actions/download-artifact@v3 can run
# (openjdk has no Node); JDK and binaries come from the artifact.
#
# Empty image: clone GITHUB_SHA with the job token over HTTPS.
# Gitea git HTTP returns 401 without the token. Do not git init or set
# init.defaultBranch here. Clone only in prep.
name: precommit

on:
  push:
  pull_request:

concurrency:
  group: precommit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  prep:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/openjdk:27-rc-bookworm
      env:
        GITHUB_TOKEN: ${{ github.token }}
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends git ca-certificates curl nodejs
      - run: |
          set -eu
          token="${GITHUB_TOKEN:-${GITEA_TOKEN:-}}"
          if [ -z "$token" ]; then echo "missing job token for git fetch" >&2; exit 1; fi
          host="${GITHUB_SERVER_URL#https://}"
          host="${host#http://}"
          git clone --depth 1 --no-checkout "https://x-access-token:${token}@${host}/${GITHUB_REPOSITORY}" .
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force FETCH_HEAD
          git remote set-url origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          chmod +x gradlew
      - run: |
          set -eu
          mkdir -p .ci/bin
          curl -sSfL -o .ci/bin/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.2.3/osv-scanner_linux_amd64
          chmod +x .ci/bin/osv-scanner
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C .ci/bin gitleaks
          chmod +x .ci/bin/gitleaks
          jdk_src="${JAVA_HOME:-/usr/local/openjdk-27}"
          test -d "$jdk_src"
          cp -a "$jdk_src" .ci/jdk
          rm -rf .ci/jdk/jmods .ci/jdk/man .ci/jdk/include .ci/jdk/demo
          export JAVA_HOME="$PWD/.ci/jdk"
          export PATH="$JAVA_HOME/bin:$PWD/.ci/bin:$PATH"
          export GRADLE_USER_HOME="$PWD/.ci/gradle-home"
          ./gradlew --no-daemon testClasses
      - run: |
          set -eu
          tar -czf /tmp/prep-workspace.tar.gz \
            --exclude=./prep-workspace.tar.gz \
            .
          mv /tmp/prep-workspace.tar.gz prep-workspace.tar.gz
      - uses: actions/upload-artifact@v3
        with:
          name: prep-workspace
          path: prep-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1

  test:
    needs: prep
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:20-bookworm
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: prep-workspace
      - run: |
          set -eu
          archive="$(find . -name prep-workspace.tar.gz -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" --no-same-owner
          chmod +x gradlew .ci/bin/*
          echo "JAVA_HOME=$PWD/.ci/jdk" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$PWD/.ci/gradle-home" >> "$GITHUB_ENV"
          echo "$PWD/.ci/jdk/bin" >> "$GITHUB_PATH"
          echo "$PWD/.ci/bin" >> "$GITHUB_PATH"
      - run: ./gradlew --no-daemon test

  sast:
    needs: prep
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:20-bookworm
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: prep-workspace
      - run: |
          set -eu
          archive="$(find . -name prep-workspace.tar.gz -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" --no-same-owner
          chmod +x gradlew .ci/bin/*
          echo "JAVA_HOME=$PWD/.ci/jdk" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$PWD/.ci/gradle-home" >> "$GITHUB_ENV"
          echo "$PWD/.ci/jdk/bin" >> "$GITHUB_PATH"
          echo "$PWD/.ci/bin" >> "$GITHUB_PATH"
      - run: ./gradlew --no-daemon detekt

  deps:
    needs: prep
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:20-bookworm
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: prep-workspace
      - run: |
          set -eu
          archive="$(find . -name prep-workspace.tar.gz -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" --no-same-owner
          chmod +x gradlew .ci/bin/*
          echo "JAVA_HOME=$PWD/.ci/jdk" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$PWD/.ci/gradle-home" >> "$GITHUB_ENV"
          echo "$PWD/.ci/jdk/bin" >> "$GITHUB_PATH"
          echo "$PWD/.ci/bin" >> "$GITHUB_PATH"
      - run: ./gradlew --no-daemon osvScan

  gitleaks:
    needs: prep
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:20-bookworm
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: prep-workspace
      - run: |
          set -eu
          archive="$(find . -name prep-workspace.tar.gz -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" --no-same-owner
          chmod +x gradlew .ci/bin/*
          echo "JAVA_HOME=$PWD/.ci/jdk" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$PWD/.ci/gradle-home" >> "$GITHUB_ENV"
          echo "$PWD/.ci/jdk/bin" >> "$GITHUB_PATH"
          echo "$PWD/.ci/bin" >> "$GITHUB_PATH"
      - run: gitleaks detect --source . --verbose

  style:
    needs: prep
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/node:20-bookworm
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: prep-workspace
      - run: |
          set -eu
          archive="$(find . -name prep-workspace.tar.gz -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" --no-same-owner
          chmod +x gradlew .ci/bin/*
          echo "JAVA_HOME=$PWD/.ci/jdk" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$PWD/.ci/gradle-home" >> "$GITHUB_ENV"
          echo "$PWD/.ci/jdk/bin" >> "$GITHUB_PATH"
          echo "$PWD/.ci/bin" >> "$GITHUB_PATH"
      - run: ./gradlew --no-daemon ktlintCheck
